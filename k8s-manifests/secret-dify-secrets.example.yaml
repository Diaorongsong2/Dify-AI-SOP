# 中间件凭据（示例文件，不要提交真实值）
#
# 用法：
#   kubectl apply -f secret-dify-secrets.example.yaml
# 或者用命令行创建，避免凭据落到文件：
#   kubectl create secret generic dify-secrets -n dify \
#     --from-literal=postgres-password='***' \
#     --from-literal=redis-password='***' \
#     --from-literal=weaviate-api-key='***'
#
# 生产环境建议接 Vault / External Secrets Operator，不做手工 apply。

apiVersion: v1
kind: Secret
metadata:
  name: dify-secrets
  namespace: dify
type: Opaque
stringData:
  postgres-password: "<YOUR_POSTGRES_PASSWORD>"
  redis-password: "<YOUR_REDIS_PASSWORD>"
  weaviate-api-key: "<YOUR_WEAVIATE_API_KEY>"
